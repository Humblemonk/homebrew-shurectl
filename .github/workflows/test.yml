name: brew test

on:
  push:
    paths: ["Formula/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tap this checkout
        run: brew tap humblemonk/shurectl "$GITHUB_WORKSPACE"

      - name: Install from formula
        run: brew install --build-from-source humblemonk/shurectl/shurectl

      - name: Run formula test block
        run: brew test humblemonk/shurectl/shurectl

      - name: Audit
        run: brew audit --formula humblemonk/shurectl/shurectl
