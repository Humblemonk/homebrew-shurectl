name: brew test

on:
  push:
    branches: [main]
    paths: ["Formula/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["Formula/**", ".github/workflows/test.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Installs/updates Homebrew and taps this checkout as humblemonk/shurectl.
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Style
        run: brew style humblemonk/shurectl

      - name: Install from formula
        run: brew install --build-from-source humblemonk/shurectl/shurectl

      - name: Run formula test block
        run: brew test humblemonk/shurectl/shurectl

      - name: Audit
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: brew audit --strict --online --formula humblemonk/shurectl/shurectl
